name: CI

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci statt npm install: baut exakt gegen package-lock.json
      - run: npm ci

      - name: Verhaltenstests (Algorithmus, Invarianten, echte Historie)
        run: npm test

      # Diese Suite lief zunaechst mit continue-on-error, weil sie offene
      # Befunde in Schema und Konfiguration dokumentierte. Seit alle Punkte
      # abgearbeitet sind, blockiert sie den Build wie jede andere Suite.
      - name: Schema- und Sicherheitspruefung
        run: npm run test:schema

      - name: Typen
        run: npx tsc --noEmit
